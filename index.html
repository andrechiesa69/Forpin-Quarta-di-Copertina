<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Social Links - Forpin Piacenza</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #ui-container {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 25px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      text-align: center;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
    }
  </style>

  <script>
    AFRAME.registerComponent('ar-click-handler', {
      init: function () {
        const sceneEl = this.el;
        const uiText = document.getElementById('ui-container');

        // Aggiorna il testo quando il target viene trovato/perso
        sceneEl.addEventListener('targetFound', () => {
          if (uiText) uiText.innerText = "Tocca un logo per aprire la pagina!";
        });

        sceneEl.addEventListener('targetLost', () => {
          if (uiText) uiText.innerText = "Inquadra l'immagine per attivare i loghi";
        });

        // Gestore del touch sui loghi 3D
        const handleTouch = (e) => {
          const touch = e.touches ? e.touches[0] : e;
          if (!touch) return;

          const mouse = new THREE.Vector2();
          mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;

          const camera = sceneEl.camera;
          if (!camera) return;

          const raycaster = new THREE.Raycaster();
          raycaster.setFromCamera(mouse, camera);

          const clickables = Array.from(document.querySelectorAll('.clickable')).map(el => el.object3D);
          const intersects = raycaster.intersectObjects(clickables, true);

          if (intersects.length > 0) {
            let hitEl = intersects[0].object.el;
            while (hitEl && !hitEl.classList.contains('clickable')) {
              hitEl = hitEl.parentElement;
            }
            if (hitEl && hitEl.dataset.url) {
              window.location.href = hitEl.dataset.url;
            }
          }
        };

        window.addEventListener('touchend', handleTouch, false);
        window.addEventListener('click', handleTouch, false);
      }
    });
  </script>
</head>
<body>

  <!-- Box informativo in basso -->
  <div id="ui-container">Inquadra l'immagine per attivare i loghi</div>

  <a-scene 
    ar-click-handler
    mindar-image="imageTargetSrc: ./targets.mind; missTolerance: 60;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="fb-img" src="./fb.png">
      <img id="in-img" src="./in.png">
      <img id="ig-img" src="./ig.png">
      <img id="yt-img" src="./yt.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target MindAR unico -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Contenitore loghi 3D posizionati sopra il foglio -->
      <!-- Ingranditi leggermente e posizionati alla giusta distanza -->
      <a-plane 
        class="clickable" 
        data-url="https://www.facebook.com/forpinpiacenza/" 
        src="#fb-img" 
        position="-0.36 0 0.05" 
        width="0.2" 
        height="0.2" 
        material="transparent: true; alphaTest: 0.1">
      </a-plane>

      <a-plane 
        class="clickable" 
        data-url="https://www.linkedin.com/company/forpin-scarl/" 
        src="#in-img" 
        position="-0.12 0 0.05" 
        width="0.2" 
        height="0.2" 
        material="transparent: true; alphaTest: 0.1">
      </a-plane>

      <a-plane 
        class="clickable" 
        data-url="https://www.instagram.com/forpinpiacenza/" 
        src="#ig-img" 
        position="0.12 0 0.05" 
        width="0.2" 
        height="0.2" 
        material="transparent: true; alphaTest: 0.1">
      </a-plane>

      <a-plane 
        class="clickable" 
        data-url="https://www.youtube.com/@ForPInScarl" 
        src="#yt-img" 
        position="0.36 0 0.05" 
        width="0.2" 
        height="0.2" 
        material="transparent: true; alphaTest: 0.1">
      </a-plane>

    </a-entity>
  </a-scene>

</body>
</html>
