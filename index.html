<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Social Links - Forpin Piacenza</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #ui-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      pointer-events: none;
      text-align: center;
    }

    /* Overlay 2D per i 30 secondi di persistenza */
    #persistent-overlay {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9998;
      display: none;
      gap: 15px;
      align-items: center;
      justify-content: center;
    }
    #persistent-overlay.active {
      display: flex !important;
    }
    .social-btn-2d {
      width: 45px;
      height: 45px;
      object-fit: contain;
      filter: drop-shadow(0px 2px 5px rgba(0,0,0,0.5));
      cursor: pointer;
    }
  </style>

  <script>
    AFRAME.registerComponent('ar-timer-handler', {
      init: function () {
        const sceneEl = this.el;
        const targetEntity = document.querySelector('[mindar-image-target]');
        const uiText = document.getElementById('ui-container');
        const overlay2D = document.getElementById('persistent-overlay');
        let hideTimer = null;

        // 1. QUANDO INQUADRI IL FOGLIO
        targetEntity.addEventListener('targetFound', () => {
          // Annulla eventuale timer di chiusura
          if (hideTimer) {
            clearTimeout(hideTimer);
            hideTimer = null;
          }
          // Nasconde l'overlay 2D e mostra i loghi 3D sul foglio
          overlay2D.classList.remove('active');
          targetEntity.setAttribute('visible', 'true');
          if (uiText) uiText.innerText = "Tocca direttamente un logo per aprire la pagina";
        });

        // 2. QUANDO SPOSTI LA FOTOCAMERA E PERDI IL FOGLIO
        targetEntity.addEventListener('targetLost', () => {
          if (hideTimer) clearTimeout(hideTimer);

          // Mostra l'overlay 2D fisso a schermo
          overlay2D.classList.add('active');

          // Timer invisibile di 30 secondi prima di nasconderli
          hideTimer = setTimeout(() => {
            overlay2D.classList.remove('active');
            if (uiText) uiText.innerText = "Inquadra l'immagine per attivare i loghi";
          }, 30000);
        });

        // Gestione touch per i loghi 3D
        const handleTouch = (e) => {
          const touch = e.touches ? e.touches[0] : e;
          if (!touch) return;

          const mouse = new THREE.Vector2();
          mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;

          const camera = sceneEl.camera;
          if (!camera) return;

          const raycaster = new THREE.Raycaster();
          raycaster.setFromCamera(mouse, camera);

          const clickables = Array.from(document.querySelectorAll('.clickable')).map(el => el.object3D);
          const intersects = raycaster.intersectObjects(clickables, true);

          if (intersects.length > 0) {
            let hitEl = intersects[0].object.el;
            while (hitEl && !hitEl.classList.contains('clickable')) {
              hitEl = hitEl.parentElement;
            }
            if (hitEl && hitEl.dataset.url) {
              window.location.href = hitEl.dataset.url;
            }
          }
        };

        window.addEventListener('touchend', handleTouch, false);
        window.addEventListener('click', handleTouch, false);
      }
    });
  </script>
</head>
<body>

  <div id="ui-container">Inquadra l'immagine per attivare i loghi</div>

  <!-- Overlay Persistente (attivo per 30s dopo aver spostato la fotocamera) -->
  <div id="persistent-overlay">
    <a href="https://www.facebook.com/forpinpiacenza/" target="_blank"><img src="./fb.png" class="social-btn-2d"></a>
    <a href="https://www.linkedin.com/company/forpin-scarl/" target="_blank"><img src="./in.png" class="social-btn-2d"></a>
    <a href="https://www.instagram.com/forpinpiacenza/" target="_blank"><img src="./ig.png" class="social-btn-2d"></a>
    <a href="https://www.youtube.com/@ForPInScarl" target="_blank"><img src="./yt.png" class="social-btn-2d"></a>
  </div>

  <a-scene 
    ar-timer-handler
    mindar-image="imageTargetSrc: ./targets.mind; missTolerance: 30;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="fb-img" src="./fb.png">
      <img id="in-img" src="./in.png">
      <img id="ig-img" src="./ig.png">
      <img id="yt-img" src="./yt.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target AR -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- 1. FACEBOOK -->
      <a-plane 
        class="clickable" 
        data-url="https://www.facebook.com/forpinpiacenza/" 
        src="#fb-img"
        position="-0.45 0 0.1" 
        width="0.25" 
        height="0.25" 
        material="transparent: true; alphaTest: 0.1">
      </a-plane>

      <!-- 2. LINKEDIN -->
      <a-plane 
        class="clickable" 
        data-url="https://www.linkedin.com/company/forpin-scarl/" 
        src="#in-img"
        position="-0.15 0 0.1" 
        width="0.25" 
        height="0.25" 
        material="transparent: true; alphaTest: 0.1">
      </a-plane>

      <!-- 3. INSTAGRAM -->
      <a-plane 
        class="clickable" 
        data-url="https://www.instagram.com/forpinpiacenza/" 
        src="#ig-img"
        position="0.15 0 0.1" 
        width="0.25" 
        height="0.25" 
        material="transparent: true; alphaTest: 0.1">
      </a-plane>

      <!-- 4. YOUTUBE -->
      <a-plane 
        class="clickable" 
        data-url="https://www.youtube.com/@ForPInScarl" 
        src="#yt-img"
        position="0.45 0 0.1" 
        width="0.25" 
        height="0.25" 
        material="transparent: true; alphaTest: 0.1">
      </a-plane>

    </a-entity>
  </a-scene>

</body>
</html>
