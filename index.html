<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Social Links - Forpin Piacenza</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Contenitore dei loghi fisso sullo schermo */
    #social-overlay {
      position: fixed;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999 !important;
      display: flex;
      gap: 6px; /* Molto vicini tra loro */
      align-items: center;
      justify-content: center;
      display: none; /* Inizialmente nascosti */
      pointer-events: auto;
    }

    /* Quando attivato, resta SEMPRE visibile indipendentemente dalla fotocamera */
    #social-overlay.is-visible {
      display: flex !important;
    }

    /* Stile icone compatte e ravvicinate */
    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.95);
      padding: 5px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: block;
    }

    .social-btn:active {
      transform: scale(0.92);
    }

    /* Box messaggi in basso */
    #ui-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999 !important;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      pointer-events: none;
      text-align: center;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
    }
  </style>

  <script>
    AFRAME.registerComponent('ar-controller', {
      init: function () {
        const sceneEl = this.el;
        const socialOverlay = document.getElementById('social-overlay');
        const uiText = document.getElementById('ui-container');
        let activated = false;

        // Quando inquadri il foglio la prima volta
        sceneEl.addEventListener('targetFound', () => {
          if (!activated) {
            activated = true;
            // Mostra i loghi e mantienili visibili per sempre
            socialOverlay.classList.add('is-visible');
            if (uiText) uiText.innerText = "Tocca un logo per aprire la pagina!";
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- Box messaggio informativo -->
  <div id="ui-container">Inquadra l'immagine per attivare i loghi</div>

  <!-- I 4 Loghi fissi vicini tra loro -->
  <div id="social-overlay">
    <a href="https://www.facebook.com/forpinpiacenza/" target="_blank" rel="noopener">
      <img src="./fb.png" class="social-btn" alt="Facebook">
    </a>
    <a href="https://www.linkedin.com/company/forpin-scarl/" target="_blank" rel="noopener">
      <img src="./in.png" class="social-btn" alt="LinkedIn">
    </a>
    <a href="https://www.instagram.com/forpinpiacenza/" target="_blank" rel="noopener">
      <img src="./ig.png" class="social-btn" alt="Instagram">
    </a>
    <a href="https://www.youtube.com/@ForPInScarl" target="_blank" rel="noopener">
      <img src="./yt.png" class="social-btn" alt="YouTube">
    </a>
  </div>

  <!-- Scena WebAR -->
  <a-scene 
    ar-controller
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target Unico -->
    <a-entity mindar-image-target="targetIndex: 0"></a-entity>

  </a-scene>

</body>
</html>
