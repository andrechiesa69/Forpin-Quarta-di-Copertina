<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Social Links - Forpin Piacenza</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #ui-container {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 25px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Pulsanti di backup quando si sposta la fotocamera */
    #fallback-bar {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9998;
      display: none;
      gap: 15px;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 18px;
      border-radius: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    #fallback-bar.show {
      display: flex !important;
    }
    .fallback-icon {
      width: 40px;
      height: 40px;
      object-fit: contain;
      cursor: pointer;
    }
  </style>

  <script>
    AFRAME.registerComponent('ar-handler', {
      init: function () {
        const sceneEl = this.el;
        const targetEntity = document.querySelector('[mindar-image-target]');
        const fallbackBar = document.getElementById('fallback-bar');
        const uiText = document.getElementById('ui-container');
        let timer = null;

        // QUANDO INQUADRI IL FOGLIO
        targetEntity.addEventListener('targetFound', () => {
          if (timer) {
            clearTimeout(timer);
            timer = null;
          }
          // Nasconde la barra di backup se attiva
          fallbackBar.classList.remove('show');
          if (uiText) uiText.innerText = "Tocca direttamente un logo per aprire la pagina";
        });

        // QUANDO SPOSTI LA FOTOCAMERA E PERDI IL FOGLIO
        targetEntity.addEventListener('targetLost', () => {
          // Mostra la barra di backup con gli stessi loghi
          fallbackBar.classList.add('show');

          // Avvia il timer di 30 secondi
          timer = setTimeout(() => {
            fallbackBar.classList.remove('show');
            if (uiText) uiText.innerText = "Inquadra l'immagine per attivare i loghi";
          }, 30000);
        });

        // Raycaster per il touch sui loghi 3D
        const handleTouch = (e) => {
          const touch = e.touches ? e.touches[0] : e;
          if (!touch) return;

          const mouse = new THREE.Vector2();
          mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;

          const camera = sceneEl.camera;
          if (!camera) return;

          const raycaster = new THREE.Raycaster();
          raycaster.setFromCamera(mouse, camera);

          const clickables = Array.from(document.querySelectorAll('.clickable')).map(el => el.object3D);
          const intersects = raycaster.intersectObjects(clickables, true);

          if (intersects.length > 0) {
            let hitEl = intersects[0].object.el;
            while (hitEl && !hitEl.classList.contains('clickable')) {
              hitEl = hitEl.parentElement;
            }
            if (hitEl && hitEl.dataset.url) {
              window.location.href = hitEl.dataset.url;
            }
          }
        };

        window.addEventListener('touchend', handleTouch, false);
        window.addEventListener('click', handleTouch, false);
      }
    });
  </script>
</head>
<body>

  <div id="ui-container">Inquadra l'immagine per attivare i loghi</div>

  <!-- Barra che appare per 30 secondi quando sposti la fotocamera -->
  <div id="fallback-bar">
    <a href="https://www.facebook.com/forpinpiacenza/"><img src="./fb.png" class="fallback-icon"></a>
    <a href="https://www.linkedin.com/company/forpin-scarl/"><img src="./in.png" class="fallback-icon"></a>
    <a href="https://www.instagram.com/forpinpiacenza/"><img src="./ig.png" class="fallback-icon"></a>
    <a href="https://www.youtube.com/@ForPInScarl"><img src="./yt.png" class="fallback-icon"></a>
  </div>

  <a-scene 
    ar-handler
    mindar-image="imageTargetSrc: ./targets.mind; missTolerance: 30;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="fb-img" src="./fb.png">
      <img id="in-img" src="./in.png">
      <img id="ig-img" src="./ig.png">
      <img id="yt-img" src="./yt.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Loghi 3D sopra la stampa del catalogo -->
      <a-plane class="clickable" data-url="https://www.facebook.com/forpinpiacenza/" src="#fb-img" position="-0.45 0 0.1" width="0.25" height="0.25" material="transparent: true; alphaTest: 0.1"></a-plane>
      <a-plane class="clickable" data-url="https://www.linkedin.com/company/forpin-scarl/" src="#in-img" position="-0.15 0 0.1" width="0.25" height="0.25" material="transparent: true; alphaTest: 0.1"></a-plane>
      <a-plane class="clickable" data-url="https://www.instagram.com/forpinpiacenza/" src="#ig-img" position="0.15 0 0.1" width="0.25" height="0.25" material="transparent: true; alphaTest: 0.1"></a-plane>
      <a-plane class="clickable" data-url="https://www.youtube.com/@ForPInScarl" src="#yt-img" position="0.45 0 0.1" width="0.25" height="0.25" material="transparent: true; alphaTest: 0.1"></a-plane>

    </a-entity>
  </a-scene>

</body>
</html>
