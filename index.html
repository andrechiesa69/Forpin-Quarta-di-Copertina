<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Social Links - Forpin Piacenza</title>
  
  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #ui-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      pointer-events: none;
      text-align: center;
    }
  </style>

  <script>
    // Componente custom per la gestione del click sui target AR
    AFRAME.registerComponent('social-link', {
      schema: {
        url: { type: 'string', default: '' }
      },
      init: function () {
        const url = this.data.url;
        this.el.addEventListener('click', () => {
          if (url) {
            window.open(url, '_blank');
          }
        });
      }
    });
  </script>
</head>
<body>

  <div id="ui-container">Inquadra i loghi e tocca un'icona per aprire il link</div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target Unico (File targets.mind compilato dall'immagine con sfondo bianco) -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- 1. FACEBOOK -->
      <a-plane 
        class="clickable" 
        social-link="url: https://www.facebook.com/forpinpiacenza/" 
        position="-0.45 0 0.01" 
        width="0.22" 
        height="0.22" 
        material="opacity: 0; transparent: true">
      </a-plane>

      <!-- 2. LINKEDIN -->
      <a-plane 
        class="clickable" 
        social-link="url: https://www.linkedin.com/company/forpin-scarl/" 
        position="-0.15 0 0.01" 
        width="0.22" 
        height="0.22" 
        material="opacity: 0; transparent: true">
      </a-plane>

      <!-- 3. INSTAGRAM -->
      <a-plane 
        class="clickable" 
        social-link="url: https://www.instagram.com/forpinpiacenza/" 
        position="0.15 0 0.01" 
        width="0.22" 
        height="0.22" 
        material="opacity: 0; transparent: true">
      </a-plane>

      <!-- 4. YOUTUBE -->
      <a-plane 
        class="clickable" 
        social-link="url: https://www.youtube.com/@ForPInScarl" 
        position="0.45 0 0.01" 
        width="0.22" 
        height="0.22" 
        material="opacity: 0; transparent: true">
      </a-plane>

    </a-entity>
  </a-scene>

</body>
</html>
