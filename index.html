<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Social Links - Forpin Piacenza</title>
  
  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #ui-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 25px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      pointer-events: none;
      text-align: center;
    }
  </style>

  <script>
    // Componente ottimizzato per l'apertura dei link su Mobile/Safari
    AFRAME.registerComponent('social-link', {
      schema: { url: { type: 'string', default: '' } },
      init: function () {
        const url = this.data.url;
        
        const handleInteraction = (evt) => {
          evt.stopPropagation();
          if (url) {
            window.location.href = url;
          }
        };

        // Rilevamento completo per touch screen e mouse
        this.el.addEventListener('click', handleInteraction);
        this.el.addEventListener('mousedown', handleInteraction);
      }
    });
  </script>
</head>
<body>

  <div id="ui-container">Tocca un logo per aprire il profilo social</div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .clickable">

    <a-assets>
      <img id="fb-img" src="./fb.png">
      <img id="in-img" src="./in.png">
      <img id="ig-img" src="./ig.png">
      <img id="yt-img" src="./yt.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- 1. FACEBOOK -->
      <a-plane 
        class="clickable" 
        social-link="url: https://www.facebook.com/forpinpiacenza/" 
        src="#fb-img"
        position="-0.45 0 0.1" 
        width="0.22" 
        height="0.22" 
        material="transparent: true; alphaTest: 0.2; blending: additive">
      </a-plane>

      <!-- 2. LINKEDIN -->
      <a-plane 
        class="clickable" 
        social-link="url: https://www.linkedin.com/company/forpin-scarl/" 
        src="#in-img"
        position="-0.15 0 0.1" 
        width="0.22" 
        height="0.22" 
        material="transparent: true; alphaTest: 0.2; blending: additive">
      </a-plane>

      <!-- 3. INSTAGRAM -->
      <a-plane 
        class="clickable" 
        social-link="url: https://www.instagram.com/forpinpiacenza/" 
        src="#ig-img"
        position="0.15 0 0.1" 
        width="0.22" 
        height="0.22" 
        material="transparent: true; alphaTest: 0.2; blending: additive">
      </a-plane>

      <!-- 4. YOUTUBE -->
      <a-plane 
        class="clickable" 
        social-link="url: https://www.youtube.com/@ForPInScarl" 
        src="#yt-img"
        position="0.45 0 0.1" 
        width="0.22" 
        height="0.22" 
        material="transparent: true; alphaTest: 0.2; blending: additive">
      </a-plane>

    </a-entity>
  </a-scene>

</body>
</html>
