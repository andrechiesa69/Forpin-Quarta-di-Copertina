<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Social Links - Forpin Piacenza</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #ui-container {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 25px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>

  <script>
    AFRAME.registerComponent('ar-persistent-3d', {
      init: function () {
        const sceneEl = this.el;
        const targetEntity = document.querySelector('[mindar-image-target]');
        const arLogos = document.getElementById('ar-logos-group');
        const worldLogos = document.getElementById('world-logos-group');
        const uiText = document.getElementById('ui-container');
        
        let hideTimer = null;

        // 1. QUANDO INQUADRI IL FOGLIO
        targetEntity.addEventListener('targetFound', () => {
          if (hideTimer) {
            clearTimeout(hideTimer);
            hideTimer = null;
          }
          // Mostra i loghi agganciati al foglio in AR e nasconde quelli nello spazio
          arLogos.setAttribute('visible', 'true');
          worldLogos.setAttribute('visible', 'false');
          if (uiText) uiText.innerText = "Tocca direttamente un logo per aprire la pagina";
        });

        // 2. QUANDO SPOSTI LA FOTOCAMERA E PERDI IL FOGLIO
        targetEntity.addEventListener('targetLost', () => {
          // Copiamo la posizione 3D esatta che avevano i loghi AR sul foglio
          const worldPos = new THREE.Vector3();
          const worldQuaternion = new THREE.Quaternion();
          const worldScale = new THREE.Vector3();

          arLogos.object3D.getWorldPosition(worldPos);
          arLogos.object3D.getWorldQuaternion(worldQuaternion);
          arLogos.object3D.getWorldScale(worldScale);

          // Applichiamo questa posizione al gruppo slegato da MindAR
          worldLogos.object3D.position.copy(worldPos);
          worldLogos.object3D.quaternion.copy(worldQuaternion);
          worldLogos.object3D.scale.copy(worldScale);

          // Nascondiamo l'AR di MindAR e attiviamo i loghi 3D congelati nello spazio
          arLogos.setAttribute('visible', 'false');
          worldLogos.setAttribute('visible', 'true');

          // Avviamo il timer di 30 secondi prima di farli sparire
          if (hideTimer) clearTimeout(hideTimer);
          hideTimer = setTimeout(() => {
            worldLogos.setAttribute('visible', 'false');
            if (uiText) uiText.innerText = "Inquadra l'immagine per attivare i loghi";
          }, 30000);
        });

        // Raycaster touch per consentire il click sui loghi 3D in entrambi gli stati
        const handleTouch = (e) => {
          const touch = e.touches ? e.touches[0] : e;
          if (!touch) return;

          const mouse = new THREE.Vector2();
          mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;

          const camera = sceneEl.camera;
          if (!camera) return;

          const raycaster = new THREE.Raycaster();
          raycaster.setFromCamera(mouse, camera);

          // Filtriamo solo gli elementi visibili
          const clickables = Array.from(document.querySelectorAll('.clickable'))
            .filter(el => {
              let p = el;
              while(p && p !== sceneEl) {
                if (p.getAttribute('visible') === 'false' || p.getAttribute('visible') === false) return false;
                p = p.parentElement;
              }
              return true;
            })
            .map(el => el.object3D);

          const intersects = raycaster.intersectObjects(clickables, true);

          if (intersects.length > 0) {
            let hitEl = intersects[0].object.el;
            while (hitEl && !hitEl.classList.contains('clickable')) {
              hitEl = hitEl.parentElement;
            }
            if (hitEl && hitEl.dataset.url) {
              window.location.href = hitEl.dataset.url;
            }
          }
        };

        window.addEventListener('touchend', handleTouch, false);
        window.addEventListener('click', handleTouch, false);
      }
    });
  </script>
</head>
<body>

  <div id="ui-container">Inquadra l'immagine per attivare i loghi</div>

  <a-scene 
    ar-persistent-3d
    mindar-image="imageTargetSrc: ./targets.mind; missTolerance: 30;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="fb-img" src="./fb.png">
      <img id="in-img" src="./in.png">
      <img id="ig-img" src="./ig.png">
      <img id="yt-img" src="./yt.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 1. LOGHI ANCORATI AL FOGLIO (Gestiti da MindAR) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity id="ar-logos-group">
        <a-plane class="clickable" data-url="https://www.facebook.com/forpinpiacenza/" src="#fb-img" position="-0.45 0 0.1" width="0.25" height="0.25" material="transparent: true; alphaTest: 0.1"></a-plane>
        <a-plane class="clickable" data-url="https://www.linkedin.com/company/forpin-scarl/" src="#in-img" position="-0.15 0 0.1" width="0.25" height="0.25" material="transparent: true; alphaTest: 0.1"></a-plane>
        <a-plane class="clickable" data-url="https://www.instagram.com/forpinpiacenza/" src="#ig-img" position="0.15 0 0.1" width="0.25" height="0.25" material="transparent: true; alphaTest: 0.1"></a-plane>
        <a-plane class="clickable" data-url="https://www.youtube.com/@ForPInScarl" src="#yt-img" position="0.45 0 0.1" width="0.25" height="0.25" material="transparent: true; alphaTest: 0.1"></a-plane>
      </a-entity>
    </a-entity>

    <!-- 2. LOGHI 3D NELLO SPAZIO LIBERO (Si attivano quando sposti la fotocamera) -->
    <a-entity id="world-logos-group" visible="false">
      <a-plane class="clickable" data-url="https://www.facebook.com/forpinpiacenza/" src="#fb-img" position="-0.45 0 0.1" width="0.25" height="0.25" material="transparent: true; alphaTest: 0.1"></a-plane>
      <a-plane class="clickable" data-url="https://www.linkedin.com/company/forpin-scarl/" src="#in-img" position="-0.15 0 0.1" width="0.25" height="0.25" material="transparent: true; alphaTest: 0.1"></a-plane>
      <a-plane class="clickable" data-url="https://www.instagram.com/forpinpiacenza/" src="#ig-img" position="0.15 0 0.1" width="0.25" height="0.25" material="transparent: true; alphaTest: 0.1"></a-plane>
      <a-plane class="clickable" data-url="https://www.youtube.com/@ForPInScarl" src="#yt-img" position="0.45 0 0.1" width="0.25" height="0.25" material="transparent: true; alphaTest: 0.1"></a-plane>
    </a-entity>

  </a-scene>

</body>
</html>
