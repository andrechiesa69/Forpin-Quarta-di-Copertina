<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Social Links - Forpin Piacenza</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Contenitore dei loghi fissati in basso al centro dello schermo */
    #social-overlay {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    /* Visibile dopo il primo aggancio */
    #social-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Stile delle icone social */
    .social-btn {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s ease;
    }

    .social-btn:active {
      transform: scale(0.9);
    }

    /* Box messaggi in basso */
    #ui-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      pointer-events: none;
      text-align: center;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
    }
  </style>

  <script>
    AFRAME.registerComponent('ar-controller', {
      init: function () {
        const sceneEl = this.el;
        const socialOverlay = document.getElementById('social-overlay');
        const uiText = document.getElementById('ui-container');
        let activated = false;

        // Quando il foglio viene riconosciuto la prima volta
        sceneEl.addEventListener('targetFound', () => {
          if (!activated) {
            activated = true;
            socialOverlay.classList.add('active');
            if (uiText) uiText.innerText = "Tocca un logo per aprire la pagina!";
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- Box messaggio -->
  <div id="ui-container">Inquadra l'immagine per attivare i loghi</div>

  <!-- I 4 Loghi HUD Fissi che ti seguono ovunque sullo schermo -->
  <div id="social-overlay">
    <a href="https://www.facebook.com/forpinpiacenza/" target="_blank">
      <img src="./fb.png" class="social-btn" alt="Facebook">
    </a>
    <a href="https://www.linkedin.com/company/forpin-scarl/" target="_blank">
      <img src="./in.png" class="social-btn" alt="LinkedIn">
    </a>
    <a href="https://www.instagram.com/forpinpiacenza/" target="_blank">
      <img src="./ig.png" class="social-btn" alt="Instagram">
    </a>
    <a href="https://www.youtube.com/@ForPInScarl" target="_blank">
      <img src="./yt.png" class="social-btn" alt="YouTube">
    </a>
  </div>

  <!-- Scena MindAR -->
  <a-scene 
    ar-controller
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target Unico -->
    <a-entity mindar-image-target="targetIndex: 0"></a-entity>

  </a-scene>

</body>
</html>
